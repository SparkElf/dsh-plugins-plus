name: Export npm token envelope

on:
  workflow_dispatch:
    inputs:
      target_public_key:
        description: Base64-encoded target Actions public key
        required: true
        type: string
      target_key_id:
        description: Target Actions public key id
        required: true
        type: string

permissions: {}

jobs:
  encrypt:
    name: encrypt token for target repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Seal npm token for target Actions key
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARGET_PUBLIC_KEY: ${{ inputs.target_public_key }}
          TARGET_KEY_ID: ${{ inputs.target_key_id }}
          ENVELOPE_PATH: ${{ runner.temp }}/npm-token-envelope.json
        run: |
          python3 <<'PY'
          import base64
          import ctypes
          import ctypes.util
          import json
          import os
          from pathlib import Path

          token = os.environ['NPM_TOKEN'].encode()
          public_key = base64.b64decode(os.environ['TARGET_PUBLIC_KEY'], validate=True)
          if not token:
              raise SystemExit('NPM_TOKEN is empty')
          if len(public_key) != 32:
              raise SystemExit('target public key must be 32 bytes')

          library = ctypes.util.find_library('sodium')
          if library is None:
              raise SystemExit('system libsodium is unavailable')
          sodium = ctypes.cdll.LoadLibrary(library)
          sodium.sodium_init.restype = ctypes.c_int
          sodium.crypto_box_seal.argtypes = [
              ctypes.c_void_p,
              ctypes.c_void_p,
              ctypes.c_ulonglong,
              ctypes.c_void_p,
          ]
          sodium.crypto_box_seal.restype = ctypes.c_int
          if sodium.sodium_init() < 0:
              raise SystemExit('libsodium initialization failed')

          message = ctypes.create_string_buffer(token)
          key = ctypes.create_string_buffer(public_key)
          sealed = ctypes.create_string_buffer(len(token) + 48)
          if sodium.crypto_box_seal(sealed, message, len(token), key) != 0:
              raise SystemExit('secret sealing failed')

          envelope = {
              'key_id': os.environ['TARGET_KEY_ID'],
              'encrypted_value': base64.b64encode(sealed.raw).decode(),
          }
          path = Path(os.environ['ENVELOPE_PATH'])
          path.write_text(json.dumps(envelope) + '\n')
          path.chmod(0o600)
          PY

      - name: Upload encrypted envelope
        uses: actions/upload-artifact@v4
        with:
          name: npm-token-envelope
          path: ${{ runner.temp }}/npm-token-envelope.json
          if-no-files-found: error
          retention-days: 1
