name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out plugin sources
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Supervisor dependencies
        run: pnpm --dir packages/supervisor install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Build publishable artifacts
        run: pnpm run build

  workbench-packages:
    name: Workbench typecheck, build, and pack (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - name: Check out plugin sources
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Workbench packages
        run: |
          pnpm --filter @sparkelf/dsh-workbench-vault run build
          pnpm --filter @sparkelf/dsh-ssh-manager run build
          pnpm --filter @sparkelf/dsh-api-client run build

      - name: Typecheck Workbench package exports
        run: pnpm exec tsc --noEmit -p tests/ci/tsconfig.workbenches.json

      - name: Create package output directory
        run: |
          node -e "require('node:fs').mkdirSync('artifacts/workbench-packs', { recursive: true })"

      - name: Pack Workbench packages
        run: |
          pnpm --dir packages/workbench-vault pack --pack-destination ../../artifacts/workbench-packs
          pnpm --dir packages/ssh-manager pack --pack-destination ../../artifacts/workbench-packs
          pnpm --dir packages/api-client pack --pack-destination ../../artifacts/workbench-packs

      - name: Verify package archives
        run: node tests/ci/verify-workbench-packs.mjs artifacts/workbench-packs

      - name: Upload package archives
        uses: actions/upload-artifact@v4
        with:
          name: workbench-packs-${{ matrix.os }}-node-${{ matrix.node }}
          path: artifacts/workbench-packs/*.tgz
          if-no-files-found: error
