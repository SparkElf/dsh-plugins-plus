# Local build of `dsh-better-sidebar` carrying the save-event extension.
#
# The published 0.25.0 only ships `src` we can patch; the client artifacts
# (`lib/client-editor.js`) are what actually run, and the package's build config is
# not part of the published files, so the artifacts cannot be rebuilt inside
# `node_modules`. This local checkout is the v0.25.0 tag with the extension applied
# and its own build run, so `lib/` matches `src/`.
#
# Pointing at the checkout also means the extension survives a reinstall: pnpm links
# this directory instead of unpacking a tarball over it.
overrides:
  dsh-better-sidebar: link:../dsh-better-sidebar-src
